# ==============================================================================
# uwr-cam-engine: Example Configuration
# ==============================================================================

version: "1.0"

# OBS Studio WebSocket v5 connection settings
obs:
  host: "localhost"
  port: 4455
  password: ""                     # Set password if OBS authentication is enabled
  timeout_sec: 3.0
  reconnect_interval_sec: 3.0

# Switching and arbitration parameters
switching:
  fallback_scene: "base"           # Default overview scene if no high-confidence tracking
  min_dwell_time_sec: 2.5          # Minimum seconds to stay on a scene (anti-flapping)
  hysteresis_threshold: 0.15       # Delta score required to switch away from current camera
  fallback_timeout_sec: 5.0        # Seconds of inactivity before reverting to fallback scene
  manual_override: false           # Pause automated switching for director control
  scene_poll_interval_sec: 0.5     # Interval in seconds to poll OBS active scene for director manual overrides
  default_weights:                 # Default scoring weights if not specified per camera
    ball: 0.7
    motion: 0.3

# Logging configuration
logging:
  level: "INFO"                    # DEBUG, INFO, WARNING, ERROR
  status_interval_sec: 5.0         # Seconds between periodic CV status summaries

# Ball detection engine configuration
ball_detector:
  enabled: true                    # Enable deep-learning ball detection
  model_name: "yolov8s-worldv2.pt" # Pre-trained YOLO-World open-vocabulary model
  confidence_threshold: 0.25       # Minimum confidence to score a ball detection
  classes:
    - "underwater ball"
    - "white ball"

# Real-time technical metrics overlay in OBS
overlay:
  enabled: false                   # Enable text overlay on broadcast
  source_name: "CV_Scores_Overlay" # Name of OBS text source
  update_interval_sec: 1.0         # Update frequency in seconds
  font_face: "Helvetica"
  font_size: 36
  font_style: "Bold"
  outline: true
  drop_shadow: true

# Real-time ball tracking marker overlay in OBS
marker:
  enabled: false                   # Enable dynamic ball tracking bounding box
  source_name: "Ball_Marker"       # Name of OBS marker image source
  update_interval_sec: 0.1         # Update frequency in seconds
  border_color: [0, 255, 0]        # RGB color (Neon Green)
  border_thickness: 4              # Border width in pixels

# Camera inputs and OBS scene mappings (2 to 6 cameras)
# Note: 'weights' (ball, motion) is optional per camera and defaults to switching.default_weights
cameras:
  - id: "cam1"
    name: "Underwater Goal Left"
    rtsp_url: "rtsp://localhost:8554/cam1/low"
    obs_scene: "cam1"

  - id: "cam2"
    name: "Underwater Goal Right"
    rtsp_url: "rtsp://localhost:8554/cam2/low"
    obs_scene: "cam2"

  - id: "cam3"
    name: "Surface Center Overview"
    rtsp_url: "rtsp://localhost:8554/cam3/low"
    obs_scene: "cam3"
